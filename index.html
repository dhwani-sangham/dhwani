<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ധ്വനി പുരുഷ സ്വയം സഹായ സംഘം</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background: #6200ea; color: white; padding: 15px; text-align: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2, h3 { margin-top: 0; color: #6200ea; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #6200ea; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #3700b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background-color: #6200ea; color: white; }
        .delete-btn { background: #d32f2f; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; }
        .delete-btn:hover { background: #9a0007; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header>
        <h2>ധ്വനി പുരുഷ സ്വയം സഹായ സംഘം</h2>
        <p style="margin: 0; font-size: 14px;">മെമ്പർ മാനേജ്മെന്റ് സിസ്റ്റം</p>
    </header>

    <div class="container">
        <!-- ലോഗിൻ / അഡ്മിൻ പാനൽ സെലക്ഷൻ -->
        <div id="login-section" class="card">
            <h3>ലോഗിൻ / വിഭാഗം തിരഞ്ഞെടുക്കുക</h3>
            <select id="user-role">
                <option value="admin">അഡ്മിൻ (Admin)</option>
                <option value="member">മെമ്പർ (Member)</option>
            </select>
            <button onclick="proceedApp()">തുടരുക</button>
        </div>

        <!-- അഡ്മിൻ ഡാഷ്‌ബോർഡ് (മെമ്പർമാരെ ചേർക്കാനും കാണാനുമുള്ള സ്ഥലം) -->
        <div id="admin-dashboard" class="card hidden">
            <h3>അഡ്മിൻ ഡാഷ്‌ബോർഡ്</h3>
            <p>പുതിയ അംഗത്തെ ചേർക്കുക:</p>
            <input type="text" id="member-name" placeholder="അംഗത്തിന്റെ പേര്">
            <input type="text" id="member-phone" placeholder="ഫോൺ നമ്പർ">
            <input type="text" id="member-amount" placeholder="സേവിങ്സ് തുക (₹)">
            <button onclick="addMember()">മെമ്പറെ ആഡ് ചെയ്യുക</button>

            <h3 style="margin-top: 20px;">അംഗങ്ങളുടെ പട്ടিকা</h3>
            <table>
                <thead>
                    <tr>
                        <th>പേര്</th>
                        <th>ഫോൺ</th>
                        <th>തുക (₹)</th>
                        <th>ആക്ഷൻ</th>
                    </tr>
                </thead>
                <tbody id="member-table-body">
                    <!-- ഡാറ്റകൾ ഇവിടെ ഡയനാമിക് ആയിവരും -->
                </tbody>
            </table>
            <br>
            <button style="background: #555;" onclick="logout()">ബാക്ക് / ലോഗൗട്ട്</button>
        </div>

        <!-- മെമ്പർ ഡാഷ്‌ബോർഡ് -->
        <div id="member-dashboard" class="card hidden">
            <h3>മെമ്പർ ഡാഷ്‌ബോർഡ്</h3>
            <p>സംഘത്തിലെ അംഗങ്ങളുടെ വിവരങ്ങൾ താഴെ കാണാം:</p>
            <table>
                <thead>
                    <tr>
                        <th>പേര്</th>
                        <th>ഫോൺ</th>
                        <th>സേവിങ്സ് (₹)</th>
                    </tr>
                </thead>
                <tbody id="member-view-table-body">
                    <!-- ഡാറ്റകൾ ഇവിടെയും കാണിക്കും -->
                </tbody>
            </table>
            <br>
            <button style="background: #555;" onclick="logout()">ബാക്ക് / ലോഗൗട്ട്</button>
        </div>
    </div>

    <script>
        // ലോക്കൽ സ്റ്റോറേജിൽ നിന്ന് ഡാറ്റ എടുക്കുക അല്ലെങ്കിൽ ഒഴിഞ്ഞ ലിസ്റ്റ് നൽകുക
        let members = JSON.parse(localStorage.getItem('dhwani_members')) || [
            { name: 'സുരേഷ്', phone: '9876543210', amount: '1000' },
            { name: 'വിനോദ്', phone: '9123456780', amount: '1500' }
        ];

        function proceedApp() {
            let role = document.getElementById('user-role').value;
            document.getElementById('login-section').classList.add('hidden');
            
            if (role === 'admin') {
                document.getElementById('admin-dashboard').classList.remove('hidden');
                renderAdminTable();
            } else {
                document.getElementById('member-dashboard').classList.remove('hidden');
                renderMemberTable();
            }
        }

        function addMember() {
            let name = document.getElementById('member-name').value;
            let phone = document.getElementById('member-phone').value;
            let amount = document.getElementById('member-amount').value;

            if (name === '' || phone === '') {
                alert('ദയവായി പേരും ഫോൺ നമ്പറും നൽകുക!');
                return;
            }

            members.push({ name, phone, amount: amount || '0' });
            localStorage.setItem('dhwani_members', JSON.stringify(members));

            document.getElementById('member-name').value = '';
            document.getElementById('member-phone').value = '';
            document.getElementById('member-amount').value = '';

            renderAdminTable();
            alert('അംഗത്തെ വിജയകരമായി ചേർത്തു!');
        }

        function deleteMember(index) {
            members.splice(index, 1);
            localStorage.setItem('dhwani_members', JSON.stringify(members));
            renderAdminTable();
        }

        function renderAdminTable() {
            let tbody = document.getElementById('member-table-body');
            tbody.innerHTML = '';
            members.forEach((m, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${m.name}</td>
                        <td>${m.phone}</td>
                        <td>₹${m.amount}</td>
                        <td><button class="delete-btn" onclick="deleteMember(${index})">ഡിലീറ്റ്</button></td>
                    </tr>
                `;
            });
        }

        function renderMemberTable() {
            let tbody = document.getElementById('member-view-table-body');
            tbody.innerHTML = '';
            members.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td>${m.name}</td>
                        <td>${m.phone}</td>
                        <td>₹${m.amount}</td>
                    </tr>
                `;
            });
        }

        function logout() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('member-dashboard').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
